<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
    <defs>
        <linearGradient id="proditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5722" />
            <stop offset="100%" stop-color="#FF8A50" />
        </linearGradient>
        <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.3" />
        </filter>
    </defs>
    
    <!-- Ícone do Monograma P + Checkmark -->
    <g filter="url(#subtleGlow)">
        <!-- Haste vertical do P -->
        <rect x="20" y="15" width="16" height="70" rx="8" fill="url(#proditGrad)" />
        
        <!-- Arco superior do P estilizado -->
        <path d="M28 15 C 65 15, 85 30, 85 50 C 85 70, 65 75, 36 75" 
              stroke="url(#proditGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              
        <!-- Elemento dinâmico de verificação/check/scan interno -->
        <path d="M42 48 L 56 62 L 92 24" 
              stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Tipografia PRODIT -->
    <text x="120" y="66" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#FFFFFF">
        PRODIT
    </text>
    
    <!-- Ponto de destaque no final -->
    <circle cx="342" cy="62" r="5" fill="url(#proditGrad)" />
</svg>
