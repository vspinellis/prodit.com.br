<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5722" />
            <stop offset="100%" stop-color="#FF8A50" />
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141B2D" />
            <stop offset="100%" stop-color="#090D17" />
        </linearGradient>
    </defs>

    <!-- Fundo Squircle / Rounded Tile -->
    <rect width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- P Monograma + Check -->
    <!-- Haste vertical -->
    <rect x="30" y="26" width="13" height="68" rx="6.5" fill="url(#iconGrad)" />
    
    <!-- Arco do P -->
    <path d="M36.5 26 C 70 26, 88 40, 88 56 C 88 72, 70 76, 43 76" 
          stroke="url(#iconGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Checkmark dinâmico branco em contraste -->
    <path d="M48 54 L 60 66 L 94 30" 
          stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
